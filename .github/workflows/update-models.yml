name: Update model list

on:
  push:
    branches: [main]
    paths: ['models/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild models/models.json
        run: |
          python3 - <<'PY'
          import json, os
          files = sorted(f for f in os.listdir('models') if f.lower().endswith('.3mf'))
          with open('models/models.json', 'w') as fh:
              json.dump(files, fh, indent=2)
              fh.write('\n')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet models/models.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add models/models.json
          git commit -m "Update model list"
          git push
