name: Update model list and images

on:
  push:
    branches: [main]
    paths: ['models/**', 'images/**', 'gallery-settings.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image resizer
        run: pip install pillow
      - name: Rebuild models/models.json and extract preview images
        run: python3 .github/scripts/update_models.py
      - name: Commit if changed
        run: |
          git add models/models.json images
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update model list and images"
          git push
